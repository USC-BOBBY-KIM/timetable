<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Week Planner</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <div>
            <h1>Campus Week Planner</h1>
            <p>Build a Monday-Friday college timetable with conflict checks and study planning.</p>
          </div>
        </div>
        <div class="online-badge" aria-live="polite">
          <span class="online-dot" aria-hidden="true"></span>
          <strong id="onlineCount">1</strong>
          <span>online</span>
          <span aria-hidden="true">🔥</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="printButton" type="button" title="Print timetable" aria-label="Print timetable">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>
          </button>
          <button class="export-button" id="savePlanButton" type="button" title="Save timetable" aria-label="Save timetable">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>
            <span>Save</span>
          </button>
          <button class="export-button" id="loadPlanButton" type="button" title="Load timetable" aria-label="Load timetable">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            <span>Load</span>
          </button>
          <input class="file-input" id="loadPlanInput" type="file" accept=".json,application/json" />
          <button class="export-button" id="exportPngButton" type="button" title="Export PNG" aria-label="Export PNG">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8h.01M3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zM3 16l5-5a2 2 0 0 1 2.8 0L15 15M13 13l2-2a2 2 0 0 1 2.8 0L21 14"/></svg>
            <span>PNG</span>
          </button>
        </div>
      </header>

      <section class="workspace" aria-label="Planner workspace">
        <aside class="control-panel">
          <section class="panel-section">
            <div class="section-heading">
              <h2>Add Item</h2>
              <button class="text-button" id="loadSampleButton" type="button">Sample</button>
            </div>
            <form id="scheduleForm" class="entry-form">
              <input type="hidden" id="editingId" />

              <label>
                <span>USC Major</span>
                <select id="programInput">
                  <option value="">Select a major</option>
                </select>
              </label>

              <label>
                <span>USC Course</span>
                <select id="courseInput" disabled>
                  <option value="">Select a major first</option>
                </select>
              </label>

              <label>
                <span>USC Section</span>
                <select id="sectionInput" disabled>
                  <option value="">Select a course first</option>
                </select>
              </label>
              <p class="field-note" id="courseCountLabel">244 USC Fall 2026 majors loaded.</p>

              <label>
                <span>Title</span>
                <input id="titleInput" type="text" placeholder="Select a USC course or enter a custom title" required maxlength="120" />
              </label>

              <label>
                <span>Type</span>
                <select id="typeInput">
                  <option>Lecture</option>
                  <option>Lab</option>
                  <option>Seminar</option>
                  <option>Study</option>
                  <option>Work</option>
                  <option>Personal</option>
                </select>
              </label>

              <fieldset class="day-picker">
                <legend>Days</legend>
                <label><input type="checkbox" name="days" value="Monday" checked /> Mon</label>
                <label><input type="checkbox" name="days" value="Tuesday" /> Tue</label>
                <label><input type="checkbox" name="days" value="Wednesday" /> Wed</label>
                <label><input type="checkbox" name="days" value="Thursday" /> Thu</label>
                <label><input type="checkbox" name="days" value="Friday" /> Fri</label>
              </fieldset>

              <div class="time-row">
                <label>
                  <span>Start</span>
                  <input id="startInput" type="time" value="09:00" required />
                </label>
                <label>
                  <span>End</span>
                  <input id="endInput" type="time" value="10:15" required />
                </label>
              </div>

              <label>
                <span>Location</span>
                <input id="locationInput" type="text" placeholder="Science Hall 204" maxlength="36" />
              </label>

              <fieldset class="color-picker">
                <legend>Color</legend>
                <label style="--swatch:#ef9da4"><input type="radio" name="color" value="#ef9da4" checked /> <span></span></label>
                <label style="--swatch:#efb99e"><input type="radio" name="color" value="#efb99e" /> <span></span></label>
                <label style="--swatch:#efd7a3"><input type="radio" name="color" value="#efd7a3" /> <span></span></label>
                <label style="--swatch:#edf1a4"><input type="radio" name="color" value="#edf1a4" /> <span></span></label>
                <label style="--swatch:#cbed99"><input type="radio" name="color" value="#cbed99" /> <span></span></label>
                <label style="--swatch:#afe9a0"><input type="radio" name="color" value="#afe9a0" /> <span></span></label>
                <label style="--swatch:#98e79d"><input type="radio" name="color" value="#98e79d" /> <span></span></label>
                <label style="--swatch:#9de8c7"><input type="radio" name="color" value="#9de8c7" /> <span></span></label>
                <label style="--swatch:#99e5df"><input type="radio" name="color" value="#99e5df" /> <span></span></label>
                <label style="--swatch:#9ecce8"><input type="radio" name="color" value="#9ecce8" /> <span></span></label>
                <label style="--swatch:#9db6e8"><input type="radio" name="color" value="#9db6e8" /> <span></span></label>
                <label style="--swatch:#9c9ce8"><input type="radio" name="color" value="#9c9ce8" /> <span></span></label>
                <label style="--swatch:#b39be8"><input type="radio" name="color" value="#b39be8" /> <span></span></label>
                <label style="--swatch:#ca98e5"><input type="radio" name="color" value="#ca98e5" /> <span></span></label>
                <label style="--swatch:#e59ae0"><input type="radio" name="color" value="#e59ae0" /> <span></span></label>
                <label style="--swatch:#e89ac3"><input type="radio" name="color" value="#e89ac3" /> <span></span></label>
                <label style="--swatch:#e99ab2"><input type="radio" name="color" value="#e99ab2" /> <span></span></label>
              </fieldset>

              <p class="form-message" id="formMessage" aria-live="polite" hidden></p>

              <div class="form-actions">
                <button class="primary-button" type="submit" id="submitButton">Add Item</button>
                <button class="secondary-button" type="button" id="cancelEditButton" hidden>Cancel</button>
              </div>
            </form>
          </section>
        </aside>

        <section class="schedule-area">
          <div class="schedule-toolbar">
            <div class="schedule-title-block">
              <div class="schedule-kicker">Mon-Fri</div>
              <h2>Week Plan</h2>
              <p id="scheduleSummary">No items yet.</p>
            </div>
            <div class="legend">
              <span><i class="legend-fixed"></i> Fixed</span>
              <span><i class="legend-study"></i> Study</span>
              <span><i class="legend-conflict"></i> Conflict</span>
            </div>
          </div>

          <div class="calendar-frame">
            <div class="calendar-grid" id="calendarGrid" aria-label="Monday through Friday timetable"></div>
          </div>
        </section>
      </section>
    </main>

    <template id="itemTemplate">
      <article class="schedule-item">
        <div class="item-title"></div>
        <div class="item-meta"></div>
        <div class="item-actions">
          <button type="button" class="mini-button edit-button" title="Edit item" aria-label="Edit item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button type="button" class="mini-button delete-button" title="Delete item" aria-label="Delete item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>
          </button>
        </div>
      </article>
    </template>

    <!-- Deployment marker: online counter and simplified Add Item flow are enabled. -->
    <script src="./usc-programs.js?v=20260529"></script>
    <script src="./app.js?v=online-section-submit-1"></script>
  </body>
</html>
